[project]
name = "mutable-realms"
version = "0.1.0"
description = "Persistent world infrastructure for AI-driven narrative experiences"
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "mcp>=1.13,<2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
